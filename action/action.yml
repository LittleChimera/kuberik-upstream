name: Setup Kuberik CLI
description: Install the Kuberik CLI on a GitHub Actions runner
author: Kuberik project
branding:
  color: blue
  icon: command
inputs:
  version:
    description: "Kuberik CLI version, e.g. 0.1.0 (defaults to latest stable release)"
    required: false
  bindir:
    description: "Alternative location for the kuberik binary, defaults to a path under $RUNNER_TOOL_CACHE."
    required: false
  token:
    description: "GitHub token used for the releases API to avoid rate limits."
    required: false
runs:
  using: composite
  steps:
    - name: Download kuberik CLI
      shell: bash
      env:
        VERSION: "${{ inputs.version }}"
        KUBERIK_TOOL_DIR: "${{ inputs.bindir }}"
        TOKEN: "${{ inputs.token }}"
      run: |
        set -euo pipefail

        if [[ -z "${VERSION}" || "${VERSION}" == "latest" ]]; then
          if [[ -n "${TOKEN}" ]]; then
            VERSION=$(curl -fsSL -H "Authorization: token ${TOKEN}" \
              https://api.github.com/repos/kuberik/kuberik/releases/latest \
              | grep tag_name | cut -d '"' -f 4)
          else
            VERSION=$(curl -w "%{url_effective}\n" -IsSL \
              https://github.com/kuberik/kuberik/releases/latest \
              -o /dev/null | sed 's$^.*/$$')
          fi
        fi
        if [[ -z "${VERSION}" ]]; then
          echo "Unable to determine Kuberik CLI version"
          exit 1
        fi
        if [[ "${VERSION}" == v* ]]; then
          VERSION="${VERSION:1}"
        fi

        OS=$(echo "${RUNNER_OS}" | tr '[:upper:]' '[:lower:]')
        if [[ "${OS}" == "macos" ]]; then
          OS="darwin"
        fi

        ARCH=$(echo "${RUNNER_ARCH}" | tr '[:upper:]' '[:lower:]')
        if [[ "${ARCH}" == "x64" ]]; then
          ARCH="amd64"
        elif [[ "${ARCH}" == "x86" ]]; then
          ARCH="386"
        fi

        EXEC="kuberik"
        EXT="tar.gz"
        if [[ "${OS}" == "windows" ]]; then
          EXEC="kuberik.exe"
          EXT="zip"
        fi

        if [[ -z "${KUBERIK_TOOL_DIR}" ]]; then
          KUBERIK_TOOL_DIR="${RUNNER_TOOL_CACHE}/kuberik/${VERSION}/${OS}/${ARCH}"
        fi

        if [[ ! -x "${KUBERIK_TOOL_DIR}/${EXEC}" ]]; then
          DL_DIR="$(mktemp -dt kuberik-XXXXXX)"
          trap 'rm -rf ${DL_DIR}' EXIT

          ARCHIVE="kuberik_${VERSION}_${OS}_${ARCH}.${EXT}"
          CHECKSUMS="checksums.txt"
          BASE="https://github.com/kuberik/kuberik/releases/download/v${VERSION}"

          echo "Downloading ${BASE}/${ARCHIVE}"
          curl -fsSL -o "${DL_DIR}/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -fsSL -o "${DL_DIR}/${CHECKSUMS}" "${BASE}/${CHECKSUMS}"

          sum=""
          if command -v sha256sum >/dev/null; then
            sum=$(sha256sum "${DL_DIR}/${ARCHIVE}" | awk '{print $1}')
          elif command -v openssl >/dev/null; then
            sum=$(openssl sha256 "${DL_DIR}/${ARCHIVE}" | awk '{print $2}')
          fi
          if [[ -z "${sum}" ]]; then
            echo "Neither sha256sum nor openssl found"
            exit 1
          fi
          expected=$(grep " ${ARCHIVE}\$" "${DL_DIR}/${CHECKSUMS}" | awk '{print $1}')
          if [[ "${sum}" != "${expected}" ]]; then
            echo "checksum mismatch for ${ARCHIVE}"
            exit 1
          fi

          mkdir -p "${KUBERIK_TOOL_DIR}"
          if [[ "${OS}" == "windows" ]]; then
            unzip "${DL_DIR}/${ARCHIVE}" "${EXEC}" -d "${KUBERIK_TOOL_DIR}"
          else
            tar xzf "${DL_DIR}/${ARCHIVE}" -C "${KUBERIK_TOOL_DIR}" "${EXEC}"
          fi
          chmod +x "${KUBERIK_TOOL_DIR}/${EXEC}"
        fi

        echo "${KUBERIK_TOOL_DIR}" >> "${GITHUB_PATH}"

    - name: Print installed kuberik version
      shell: bash
      run: kuberik version
