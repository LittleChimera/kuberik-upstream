{{- if .Values.rolloutController.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "kuberik.fullname" . }}-test-ready"
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kuberik.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  serviceAccountName: {{ default "rollout-controller-controller-manager" .Values.tests.serviceAccountName }}
  containers:
    - name: kubectl
      image: registry.k8s.io/kubectl:v1.31.0
      command:
        - kubectl
      args:
        - wait
        - --for=condition=Available
        - --timeout=120s
        - -n
        - {{ .Values.namespace }}
        - deployment/rollout-controller
{{- end }}
