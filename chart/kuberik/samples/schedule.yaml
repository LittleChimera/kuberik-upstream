# Sample RolloutSchedule: allow promotions only during business hours.
# Outside the window, the auto-managed gate is closed.
#
# Rollouts opt in by carrying the label kuberik.com/schedule=business-hours
# (or whichever selector you choose).
---
apiVersion: kuberik.com/v1alpha1
kind: RolloutSchedule
metadata:
  name: business-hours
  namespace: default
spec:
  rolloutSelector:
    matchLabels:
      kuberik.com/schedule: business-hours
  action: Allow
  timezone: "America/New_York"
  rules:
    - daysOfWeek: [Monday, Tuesday, Wednesday, Thursday, Friday]
      timeRange:
        start: "09:00"
        end: "17:00"
