# Sample Rollout: tracks one image policy with a 10-minute bake window.
# kubectl apply -f rollout.yaml
---
apiVersion: kuberik.com/v1alpha1
kind: Rollout
metadata:
  name: my-app
  namespace: default
spec:
  releasesImagePolicy:
    name: my-app
    namespace: flux-system
  versionHistoryLimit: 10
  releaseUpdateInterval: 5m
  bakeTime: 10m
