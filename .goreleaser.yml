project_name: kuberik
changelog:
  use: github-native
builds:
  - <<: &build_defaults
      binary: kuberik
      main: ./cmd/kuberik
      ldflags:
        - -s -w -X main.Version={{ .Version }}
      env:
        - CGO_ENABLED=0
    id: linux
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
  - <<: *build_defaults
    id: darwin
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
  - <<: *build_defaults
    id: windows
    goos:
      - windows
    goarch:
      - amd64
archives:
  - name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    id: nix
    builds: [linux, darwin]
    format: tar.gz
    files:
      - LICENSE
      - README.md
  - name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    id: windows
    builds: [windows]
    format: zip
    files:
      - LICENSE
      - README.md
source:
  enabled: true
  name_template: '{{ .ProjectName }}_{{ .Version }}_source_code'
checksum:
  name_template: 'checksums.txt'
brews:
  - name: kuberik
    repository:
      owner: kuberik
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://kuberik.com"
    description: "Kuberik CLI - Kubernetes-native continuous delivery"
    license: "Apache-2.0"
    install: |
      bin.install "kuberik"
      generate_completions_from_executable(bin/"kuberik", "completion")
    test: |
      system "#{bin}/kuberik", "version"
dockers:
  - image_templates:
      - 'ghcr.io/kuberik/kuberik-cli:{{ .Tag }}-amd64'
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - "--pull"
      - "--build-arg=ARCH=linux/amd64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.name={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--platform=linux/amd64"
  - image_templates:
      - 'ghcr.io/kuberik/kuberik-cli:{{ .Tag }}-arm64'
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - "--pull"
      - "--build-arg=ARCH=linux/arm64"
      - "--label=org.opencontainers.image.created={{ .Date }}"
      - "--label=org.opencontainers.image.name={{ .ProjectName }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--platform=linux/arm64"
docker_manifests:
  - name_template: 'ghcr.io/kuberik/kuberik-cli:{{ .Tag }}'
    image_templates:
      - 'ghcr.io/kuberik/kuberik-cli:{{ .Tag }}-amd64'
      - 'ghcr.io/kuberik/kuberik-cli:{{ .Tag }}-arm64'
  - name_template: 'ghcr.io/kuberik/kuberik-cli:latest'
    image_templates:
      - 'ghcr.io/kuberik/kuberik-cli:{{ .Tag }}-amd64'
      - 'ghcr.io/kuberik/kuberik-cli:{{ .Tag }}-arm64'
