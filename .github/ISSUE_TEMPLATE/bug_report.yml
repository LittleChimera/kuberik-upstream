name: Bug Report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening, search [existing issues](https://github.com/kuberik/kuberik/issues) to avoid duplicates.
  - type: input
    id: component
    attributes:
      label: Component
      description: Which Kuberik component is affected?
      placeholder: "e.g. rollout-controller, datadog-controller"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "e.g. v0.7.0"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Apply this manifest...
        2. Run kubectl get...
        3. See error
    validations:
      required: true
  - type: textarea
    id: manifests
    attributes:
      label: Relevant manifests or config
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Controller logs
      render: shell
