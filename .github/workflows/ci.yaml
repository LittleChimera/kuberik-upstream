name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -v ./...
      - name: Test
        run: go test -race -coverprofile=coverage.txt ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup kustomize
        uses: imranismail/setup-kustomize@v2
      - name: Build install manifest
        run: kustomize build config/install > /tmp/install.yaml
      - name: Validate YAML
        run: |
          test -s /tmp/install.yaml
          head -50 /tmp/install.yaml

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Lint chart
        run: helm lint chart/kuberik
      - name: Render chart (defaults)
        run: helm template kuberik chart/kuberik > /tmp/kuberik-default.yaml
      - name: Render chart (all integrations + dashboard)
        run: |
          helm template kuberik chart/kuberik \
            --set integrations.datadog.enabled=true \
            --set integrations.prometheus.enabled=true \
            --set integrations.openkruise.enabled=true \
            --set integrations.environment.enabled=true \
            --set dashboard.enabled=true \
            > /tmp/kuberik-all.yaml
      - name: Validate rendered output with kubeval-style check
        run: |
          # Count top-level kinds to confirm dashboard + integrations rendered
          grep -c "^kind: Deployment" /tmp/kuberik-all.yaml | grep -q "^5$" || \
            { echo "expected 5 Deployments (rollout + 3 integrations + dashboard)"; exit 1; }
      - name: Validate output is non-empty
        run: |
          test -s /tmp/kuberik-default.yaml
          test -s /tmp/kuberik-all.yaml

  helm-install-kind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kuberik-helm
      - name: Install chart with defaults
        # Use --create-namespace and disable the chart's namespace template
        # so the two do not collide.
        run: |
          helm install kuberik chart/kuberik \
            --namespace kuberik-system --create-namespace \
            --set createNamespace=false \
            --wait --timeout 3m
      - name: Verify rollout-controller is Available
        run: |
          kubectl wait --for=condition=Available --timeout=120s \
            -n kuberik-system deployment -l app.kubernetes.io/name=rollout-controller
      - name: Show installed resources
        if: always()
        run: |
          kubectl get all -n kuberik-system
          kubectl get crd | grep kuberik
