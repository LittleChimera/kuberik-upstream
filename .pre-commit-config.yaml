# Pre-commit hooks for the kuberik repo.
# Install once: pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
        exclude: '^chart/kuberik/(crds|templates)/.*\.ya?ml$'
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.64.8
    hooks:
      - id: golangci-lint
        args: ["--config=.golangci.yml"]
        files: '\.go$'

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.14.0
    hooks:
      - id: markdownlint-cli2
        args: ["--config", ".markdownlint.json"]
        files: '\.md$'

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: helm lint chart/kuberik
        language: system
        pass_filenames: false
        files: '^chart/'
