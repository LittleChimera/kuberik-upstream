# Restrict promotions to business hours, weekdays only.
#
# `action: Allow` means the gate is open during the window and closed
# outside it - so promotions happen only between 9am and 5pm Eastern,
# Monday through Friday.
#
# Rollouts opt in via the rolloutSelector label below.
---
apiVersion: kuberik.com/v1alpha1
kind: RolloutSchedule
metadata:
  name: business-hours-only
  namespace: production
spec:
  rolloutSelector:
    matchLabels:
      kuberik.com/schedule: business-hours-only
  action: Allow
  timezone: "America/New_York"
  rules:
    - daysOfWeek: [Monday, Tuesday, Wednesday, Thursday, Friday]
      timeRange:
        start: "09:00"
        end: "17:00"
