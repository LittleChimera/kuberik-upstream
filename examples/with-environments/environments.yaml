# Multi-environment promotion: production proceeds only after staging.
#
# environment-controller reads each Environment's `relationship` and
# creates a RolloutGate on the downstream Rollout that closes until
# the upstream Environment reports a successful deployment via the
# configured backend (GitHub Deployments in this example).
#
# Requires environment-controller installed (helm: integrations.environment.enabled=true).
---
apiVersion: environments.kuberik.com/v1alpha1
kind: Environment
metadata:
  name: staging
  namespace: staging
spec:
  rolloutRef:
    name: my-app
  name: my-app-staging
  environment: staging
  backend:
    type: github
    project: myorg/my-app
    secret: github-token
---
apiVersion: environments.kuberik.com/v1alpha1
kind: Environment
metadata:
  name: production
  namespace: production
spec:
  rolloutRef:
    name: my-app
  name: my-app-production
  environment: production
  backend:
    type: github
    project: myorg/my-app
    secret: github-token
  # Production proceeds only after staging finishes deploying.
  relationship:
    type: After
    environment: staging
