# A manual approval gate. Set spec.passing to true to allow the rollout to proceed.
#
# Approve via CLI:
#   kuberik approve my-app-approval -n default
#
# Or via kubectl:
#   kubectl patch rolloutgate my-app-approval -n default \
#     --type merge -p '{"spec":{"passing":true}}'
---
apiVersion: kuberik.com/v1alpha1
kind: RolloutGate
metadata:
  name: my-app-approval
  namespace: default
spec:
  rolloutRef:
    name: my-app
  passing: false
